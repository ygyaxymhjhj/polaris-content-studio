name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Offline regressions: fake database / mocked Postiz, no server or MySQL required.
      # Browser suites (test-auth, test-source-handoff, test-project-storage, test-ui-languages)
      # need a running app + MySQL and stay a manual step after deploy.
      - run: node scripts/test-postiz-connect.mjs
      - run: node scripts/test-user-roles.mjs
      - run: node scripts/test-social-ownership.mjs
      - run: node scripts/test-article-collector.mjs
      - run: node scripts/test-asset-starters.mjs
      - run: node scripts/test-deploy-lan.mjs
